name: Weekly sermon refresh

# Sermons are posted most Mondays. Vercel only rebuilds the site on a push or
# a CMS edit, so without this the homepage/sermons page would keep showing
# last week's video until something else triggered a deploy. This just pings
# a Vercel Deploy Hook — no site code runs here, no secrets are logged.
on:
  schedule:
    - cron: "0 20 * * 1" # Monday 20:00 UTC
    - cron: "0 6 * * 2" # Tuesday 06:00 UTC, in case Monday's upload is late
  workflow_dispatch: {} # lets you trigger a rebuild manually from the Actions tab

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
